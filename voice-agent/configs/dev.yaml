  system_prompt: "You are Sophia voice overlay for Hermes. Keep outputs short and task-focused."
stt:
  refine_enabled: true
  model_size: tiny
  compute_type: int8
  cpu_threads: 2
vad:
  aggressiveness: 2
  energy_threshold: 0.005
auth:
  threshold: 0.1
  require_challenge: false
