[project]
name = "voice-agent"
version = "0.1.0"
description = "Local Voice Authenticated Realtime Agent"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "fastapi>=0.115",
  # Pin Starlette to the range compatible with the FastAPI above. Newer
  # Starlette (>=1.0) removed constructor kwargs FastAPI relies on and breaks
  # app construction (e.g. Router.__init__() got an unexpected keyword
  # argument 'on_startup').
  "starlette>=0.37.2,<0.39.0",
  "uvicorn>=0.23",
  "websockets>=11.0",
  "pydantic>=2.6",
  "python-multipart>=0.0.9",
  "numpy>=1.24",
  "soundfile>=0.12",
   "pyyaml>=6.0",
   "requests>=2.31",
   "httpx>=0.27",
   "neo4j>=5.0",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
voice = ["sounddevice>=0.4"]
graph = ["neo4j>=5.0"]
insight = ["speechbrain>=1.0", "torch>=2.2", "torchaudio>=2.2", "faster-whisper>=1.0", "ctranslate2>=4.0"]
diarization = ["pyannote.audio>=3.1"]
tts-openvoice = ["openvoice", "melo", "torch>=2.2", "scipy>=1.10"]
tts-coqui = ["TTS>=0.22", "torch>=2.2", "scipy>=1.10"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
voice-agent = "voice_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]
exclude = ["scripts/patch_tts_transformers.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501", "B008", "B904"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "F401", "F811"]
