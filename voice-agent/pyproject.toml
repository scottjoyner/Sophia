[project]
name = "voice-agent"
version = "0.1.0"
description = "Local Voice Authenticated Realtime Agent"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.23",
  "websockets>=11.0",
  "pydantic>=2.6",
  "python-multipart>=0.0.9",
  "numpy>=1.24",
  "soundfile>=0.12",
  "pyyaml>=6.0",
  "requests>=2.31",
  "neo4j>=5.0",
]

[project.optional-dependencies]
voice = ["sounddevice>=0.4"]
graph = ["neo4j>=5.0"]
insight = ["speechbrain>=1.0", "torch>=2.2", "torchaudio>=2.2"]
diarization = ["pyannote.audio>=3.1"]
tts-openvoice = ["openvoice", "melo", "torch>=2.2", "scipy>=1.10"]
tts-coqui = ["TTS>=0.22", "torch>=2.2", "scipy>=1.10"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
voice-agent = "voice_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
