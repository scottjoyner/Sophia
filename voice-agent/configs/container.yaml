server:
  host: 0.0.0.0
  port: 8765
  protocol: hermes_overlay_v1
paths:
  artifacts_dir: /data/runs
  workspace_dir: /data/workspace
  capture_dir: /captures
runtime:
  max_memory_gb: 8
  allow_hf_downloads: true
llm:
  provider: mock
  intent_provider: mock
  intent_model: draft-model
  system_prompt: "You are Sophia voice overlay for Hermes. Keep outputs short and task-focused."
stt:
  refine_enabled: true
  model_size: tiny
  compute_type: int8
  cpu_threads: 2
vad:
  aggressiveness: 2
  energy_threshold: 0.005
tts:
  backend: openvoice
  speaker_wav: /data/voice-insight/reference_scott.wav
  openvoice_model_path: /models/openvoice
  coqui_model_name: tts_models/multilingual/multi-dataset/xtts_v2
  use_gpu: false
auth:
  threshold: 0.60
  require_challenge: false
neo4j:
  uri: bolt://host.docker.internal:7687
  user: neo4j
  password_file: /run/secrets/neo4j_password
  password:
  # Canonical: Sophia memory graph lives in "neo4j". Control-plane (tasks,
  # traces) is owned by AssistX in the "assistx" database. (LLD §3.1 W-08)
  database: neo4j
  default_speaker_name:
