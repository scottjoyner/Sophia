name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install "ruff>=0.6"
      - name: Ruff check
        working-directory: voice-agent
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voice-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package with dev extras
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q

  # W-17: graph / voiceprint / lineage tests require a live Neo4j. They are
  # skipped when NEO4J_PASSWORD is unset (see tests that check for it). This job
  # brings up a Neo4j service container so those paths actually execute.
  neo4j-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voice-agent
    services:
      neo4j:
        image: neo4j:5.20-community
        env:
          NEO4J_AUTH: neo4j/knowledge_graph_2026
          NEO4J_dbms_security_auth__minimum__password__length: "8"
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "wget -q -O /dev/null http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: knowledge_graph_2026
      NEO4J_DATABASE: neo4j
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package with dev + graph extras
        run: pip install -e ".[dev,graph]"
      - name: Wait for Neo4j
        run: |
          for i in $(seq 1 30); do
            if python -c "import socket; s=socket.create_connection(('localhost',7687),timeout=2); s.close(); print('up')" 2>/dev/null; then
              echo "neo4j is up"; break
            fi
            sleep 2
          done
      - name: Run Neo4j-backed tests
        run: pytest -q -k "neo4j or graph or voiceprint or lineage"
