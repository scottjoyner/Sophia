server:
  host: 0.0.0.0
  port: 8765
  protocol: hermes_overlay_v1
paths:
  artifacts_dir: runs
  workspace_dir: workspace
runtime:
  max_memory_gb: 8
  allow_hf_downloads: false
llm:
