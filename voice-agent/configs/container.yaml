server:
  host: 0.0.0.0
  port: 8765
  protocol: hermes_overlay_v1
paths:
  artifacts_dir: /data/runs
  workspace_dir: /data/workspace
  capture_dir: /captures
runtime:
  max_memory_gb: 8
  allow_hf_downloads: true
llm:
  provider: mock
  intent_provider: mock
  intent_model: draft-model
  system_prompt: "You are Sophia voice overlay for Hermes. Keep outputs short and task-focused."
stt:
  refine_enabled: true
  model_size: tiny
  compute_type: int8
  cpu_threads: 2
vad:
  aggressiveness: 2
  energy_threshold: 0.005
auth:
  threshold: 0.1
  require_challenge: false
neo4j:
  uri: bolt://host.docker.internal:7687
  user: neo4j
  password:
  database: memory
  default_speaker_name:
