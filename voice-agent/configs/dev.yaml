server:
  host: 0.0.0.0
  port: 8765
  protocol: hermes_overlay_v1
paths:
  artifacts_dir: runs
  workspace_dir: workspace
runtime:
  max_memory_gb: 8
  allow_hf_downloads: false
llm:
  provider: mock
  intent_provider: mock
  intent_model: draft-model
  # To route directly to a Hermes/OpenAI-compatible endpoint, set:
  # provider: hermes
  # base_url: http://host.docker.internal:8000
  # model: hermes
  # intent_provider: hermes
  # intent_base_url: http://host.docker.internal:8000
  # intent_model: small-draft-model
  system_prompt: "You are Sophia voice overlay for Hermes. Keep outputs short and task-focused."
stt:
  refine_enabled: true
  model_size: tiny
  compute_type: int8
  cpu_threads: 2
vad:
  aggressiveness: 2
  energy_threshold: 0.005
auth:
  threshold: 0.60
  require_challenge: false
